<h2>Contacto</h2>
<button (click)="cambiarContacto()">
    @if (mostrarContacto) {
        Ocultar contacto
    } @else {
        Mostrar contacto
    }
</button>

@if (mostrarContacto) {
    <ul>
        <li>{{ ciudadNacimiento }}</li>
        <li>{{ numTelefono }}</li>
        <li>{{ email }}</li>
    </ul>
}

<h2>Idiomas</h2>
<ul>
    <li>Español</li>
    <li>Inglés</li>
</ul>
